services:
  #database layer
  db:
    image: postgres:18-alpine
    container_name: kanzen_db
    environment:
      POSTGRES_PASSWORD: ${PSQL_PASSWORD}
      POSTGRES_USER: ${PSQL_USER}
      POSTGRES_DB: ${PSQL_DB}
    ports:
      - "5432:5432"
    volumes:
        - kanzen_db_data:/var/lib/postgresql/data
  #backend service
  backend:
    build: ./backend/
    container_name: kanzen_backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes: 
      - ./backend:/backend
    environment: 
       DB_URL: ${DB_URL}
  #frontend layer
  frontend:
    build: ./frontend
    container_name: kanzen_frontend
    ports: 
    - "5173:5173"
    volumes:
      - ./frontend/:/frontend 
      - /frontend/node_modules
    depends_on: 
      - backend
volumes:
  kanzen_db_data:

